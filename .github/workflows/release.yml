name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Verify version matches tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Host "Manual workflow run: skipping tag/version check."
            exit 0
          }
          $version = (Get-Content pyproject.toml | Select-String '^version\s*=\s*"([^"]+)"$').Matches.Groups[1].Value
          $expected = $tag.Substring(1)
          if ($version -ne $expected) {
            throw "Tag $tag does not match pyproject version $version."
          }
          Write-Host "Version verified: $version"

      - name: Run tests
        run: python -m pytest

      - name: Build Python distributions
        run: python -m build --outdir release/artifacts

      - name: Build Windows one-file executable
        run: python -m PyInstaller --noconfirm --clean release/eli_lab_pattern_generator.spec

      - name: Verify one-file executable
        shell: pwsh
        run: |
          $exe = 'dist/eli_lab-pattern-generator.exe'
          if (-not (Test-Path $exe)) {
            throw "Expected one-file executable was not created: $exe"
          }
          Write-Host "Windows executable: $exe"

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eli_lab-pattern-generator-release
          path: |
            dist/eli_lab-pattern-generator.exe
            release/artifacts/*.whl
            release/artifacts/*.tar.gz
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Host 'Manual workflow run: build artifacts were created, but no GitHub Release was published.'
            exit 0
          }
          $files = @(
            'dist/eli_lab-pattern-generator.exe'
            (Get-ChildItem 'release/artifacts/*.whl').FullName
            (Get-ChildItem 'release/artifacts/*.tar.gz').FullName
          )
          gh release create $tag --title "eli_lab Pattern Generator $tag" --generate-notes $files
