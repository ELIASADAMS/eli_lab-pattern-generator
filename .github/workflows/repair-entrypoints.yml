name: Repair Python entrypoints

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair malformed future imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("pattern_app/generator.py", "pattern_app/main.py"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = text.replace("from __future__\n", "from __future__ import annotations\n", 1)
              path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/repair-entrypoints.yml
      - name: Commit repaired sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pattern_app/generator.py pattern_app/main.py .github/workflows/repair-entrypoints.yml
          git commit -m "fix: repair Python future imports and entrypoints" || exit 0
          git push
